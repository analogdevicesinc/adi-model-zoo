version: "1.0"
schema_type: "edge_ai_model"

model:
  name: "ds_cnn_s_float32"
  version: "1.0.0"
  description: "Depthwise Separable Convolutional Neural Network (DS-CNN) Small model is for keyword spotting on MAX32690 and ADSP-SC835 devices. This uses Google Speech Commands V2 dataset which contains a set of one-second .wav audio files, each containing a small set of commands."

  formats:
    - format: "TFLite"
      model_files:
        - name: "ds_cnn_s_float32.tflite"
          precision: "float32"
          size_mb: 0.097

  metadata:
    authors:
      - name: ["Zhang", "Suda", "Lai", "Chandra"]
        organization: "ARM Research, Stanford University"
    license:
      model:
        name: "Apache 2.0"
        url: "https://spdx.org/licenses/Apache-2.0.html"
      dataset:
        name: "Google Speech Commands V2"
        url: "https://spdx.org/licenses/CC-BY-4.0.html"
    research:
      papers:
        - title: "Hello Edge: Keyword Spotting on Microcontrollers"
          authors: ["Zhang", "Suda", "Lai", "Chandra"]
          url: "https://arxiv.org/abs/1711.07128"

  inputs:
    - name: "input"
      type: "audio"
      shape: [1, 490]
      dtype: "float32"

  outputs:
    - name: "identity"
      type: "identity"
      shape: [1, 12]
      dtype: "float32"
