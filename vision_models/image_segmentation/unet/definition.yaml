version: "1.0"
schema_type: "edge_ai_model"

model:
  name: "UNet"
  version: "1.0"
  description: "Image segmentation network that combines a contracting path and an expanding path through skip connections to generate precise pixel‑wise class predictions"

  formats: 
    - format: "ai8x"
      model_files:
        - name: "ai85net-unet.py"
        - name: "ai85-aisegment-unet-large-q.pth.tar"
          precision: "INT8"
          size_mb: 3.23
        - name: "ai85-aisegment-unet-large-fakept-q.pth.tar"
          precision: "INT8"
          size_mb: 3.25

  metadata:
    authors:
      - name: "Olaf Ronneberger"
      - name: "Philipp Fischer"
      - name: "Thomas Brox"
        
    license:
      model:
        name: "Apache 2.0"
        url: "https://spdx.org/licenses/Apache-2.0.html"  
      dataset:
        name: "MIT"
        url: "https://spdx.org/licenses/MIT.html"

    research:
      papers:
        - title: "U-Net: Convolutional Networks for Biomedical Image Segmentation"
          authors: ["Olaf Ronneberger", "Philipp Fischer", "Thomas Brox"]
          url: "https://arxiv.org/abs/1505.04597"

  inputs:
    - name: "input"
      type: "image"
      shape: [48, 48, 48]
      dtype: "int8"

  outputs:
    - name: "output"
      type: "segmented mask"
      shape: [1, 32, 48, 48]
      dtype: "int8"
