version: "1.0"
schema_type: "edge_ai_model"

model:
  name: "SimpleNet"
  version: "1.0"
  description: "Image classification through sequential convolutional blocks that progressively reduce spatial size and increase channel depth, then apply global average pooling and a Softmax layer"

  formats: 
    - format: "ai8x"
      model_files:
        - name: "ai85net-simplenet-wide2x.py"
        - name: "ai85-cifar100-simplenetwide2x-qat-mixed-q.pth.tar"
          precision: "INT8"
          size_mb: 8.40

  metadata:
    authors:
      - name: "Seyyed Hossein Hasanpour"
      - name: "Mohammad Rouhani"
      - name: "Mohsen Fayyaz"
      - name: "Mohammad Sabokrou"
        
    license:
      model:
        name: "Apache 2.0"
        url: "https://spdx.org/licenses/Apache-2.0.html"  
      dataset:
        name: "MIT"
        url: "https://spdx.org/licenses/MIT.html"

    research:
      papers:
        - title: "Lets keep it simple, Using simple architectures to outperform deeper and more complex architectures"
          authors: ["Seyyed Hossein Hasanpour", "Mohammad Rouhani", "Mohsen Fayyaz", "Mohammad Sabokrou"]
          url: "https://arxiv.org/abs/1608.06037"

  inputs:
    - name: "input"
      type: "image"
      shape: [3, 32, 32]
      dtype: "int8"

  outputs:
    - name: "output"
      type: "confidence scores"
      shape: [1, 100]
      dtype: "float32"
