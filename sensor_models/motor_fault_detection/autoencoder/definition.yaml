version: "1.0"
schema_type: "edge_ai_model"

model:
  name: "Autoencoder"
  version: "1.0"
  description: "Network that compresses the input data and reconstructs the original data from this representation, enabling efficient detection of faults in motor signals"

  formats: 
    - format: "ai8x"
      model_files:
        - name: "ai85net-autoencoder.py"
        - name: "ai85-autoencoder-samplemotordatalimerick-qat-q.pth.tar"
          precision: "INT8"
          size_mb: 1.59

  metadata:
    authors:
      - name: "Analog Devices Inc."
        
    license:
      model:
        name: "Apache 2.0"
        url: "https://spdx.org/licenses/Apache-2.0.html"  
      dataset:
        name: "Apache 2.0"
        url: "https://spdx.org/licenses/Apache-2.0.html"

  inputs:
    - name: "input"
      type: "signal"
      shape: [256, 3]
      dtype: "int8"

  outputs:
    - name: "output"
      type: "signal"
      shape: [256, 3]
      dtype: "int8"
